<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Информатика Flashcards</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Информатика Flashcards</h1>

    <div id="card" class="card">
      <p id="cardText">Сұрақ жүктелуде...</p>
    </div>

    <div class="controls">
      <button onclick="prevCard()">⬅️ Алдыңғы</button>
      <span id="counterText">0 / 0</span>
      <button onclick="nextCard()">➡️ Келесі</button>
    </div>

    <span id="timerDisplay">⏳ Таймер өшірулі</span>

    <button id="speakBtn">🔊 Дыбыстап оқу</button>
    <button id="autoBtn">⏱️ Таймер: Өшірулі</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
